<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'"
    />
    <meta
      http-equiv="X-Content-Security-Policy"
      content="default-src 'self'; script-src 'self'"
    />
    <title>Kaluga</title>
    <link rel="stylesheet" href="assets/style/styles.css" />
    <link rel="stylesheet" href="assets/style/notifications.css" />
  </head>
  <body>
    <div class="app">
      <header class="header">
        <h1 class="header__title">Kaluga v1.0.1</h1>
        <div class="header__right">
          <p class="header__count">0 документов</p>
          <a class="header__icon" href="settings.html" aria-label="Настройки">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path
                fill="currentColor"
                d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.07 7.07 0 0 0-1.63-.94l-.36-2.54A.5.5 0 0 0 13.9 2h-3.8a.5.5 0 0 0-.49.42l-.36 2.54c-.59.24-1.13.55-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.71 8.48a.5.5 0 0 0 .12.64l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94L2.83 14.16a.5.5 0 0 0-.12.64l1.92 3.32c.13.23.4.32.64.22l2.39-.96c.5.39 1.04.7 1.63.94l.36 2.54c.05.24.25.42.49.42h3.8c.24 0 .44-.18.49-.42l.36-2.54c.59-.24 1.13-.55 1.63-.94l2.39.96c.24.1.51 0 .64-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58ZM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Z"
              />
            </svg>
          </a>
        </div>
      </header>

      <main class="docs">
        <button class="card card--create" id="create-btn" type="button">
          <span class="card__plus">+</span>
        </button>
      </main>
    </div>

    <div class="modal" id="template-modal" hidden>
      <div class="modal__backdrop" data-close-modal></div>
      <div
        class="modal__dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modal-title"
      >
        <header class="modal__header">
          <h2 class="modal__title" id="modal-title">Новый документ</h2>
          <button class="modal__close" type="button" data-close-modal aria-label="Закрыть">
            ×
          </button>
        </header>
        <div class="modal__body">
          <button class="template" type="button" data-template="offers/kks-kp-1.html">
            <div class="template__preview" aria-hidden="true">
              <span class="card__line"></span>
              <span class="card__line card__line--short"></span>
              <span class="card__line"></span>
              <span class="card__line card__line--mid"></span>
            </div>
            <span class="template__name">ККС_КП-1</span>
          </button>
        </div>
      </div>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
